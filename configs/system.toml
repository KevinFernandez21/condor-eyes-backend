# Ejecutor local del sistema multiagente (issue #41). Documentación: docs/system-runner.md
# Uso: uv run python scripts/run_system.py --profile sim|laptop|replay [--duration S]
# Las rutas relativas se resuelven contra la raíz del repositorio.
# Cualquier clave desconocida, número no finito (nan/inf) o `kind` fuera de catálogo
# aborta el arranque con un error de configuración.

[system]
default_profile = "sim"
heartbeat_interval_s = 2.0      # salud de roles y componentes en Topic.HEALTH
fusion_interval_s = 1.0         # cada cuánto evalúa la fusión (publica solo cambios)
shutdown_timeout_s = 5.0        # vaciado de colas y unión de hilos al detener
queue_size = 1024               # cola por suscripción del hub
history_size = 1000             # mensajes recientes retenidos por el hub (depuración)
recent_limit = 50               # eventos/alertas recientes retenidos por los sumideros
fusion_config = "configs/fusion.toml"

# API de observabilidad de solo lectura (#42). Se activa con --api (no hay token aquí:
# usar --token o CONDOR_API_TOKEN). Bind 127.0.0.1; otro host exige token.
# allowed_origins: páginas web autorizadas a abrir el WebSocket (CSWSH). Debe incluir
# el origen donde se sirve el dashboard (#43): por defecto http://127.0.0.1:8080 y
# http://localhost:8080. Reemplaza la lista por defecto de la API.
[api]
host = "127.0.0.1"
port = 8000
allowed_origins = ["http://127.0.0.1:8080", "http://localhost:8080"]

# Zonas por franjas horizontales del encuadre ([x_min, x_max) como fracción de 0 a 1).
[[zones]]
zone_id = "lobby"
restricted = false
x_min = 0.0
x_max = 0.5

[[zones]]
zone_id = "vault"
restricted = true
x_min = 0.5
x_max = 1.0

# Zonas permitidas por persona. Las claves son identificadores de simulación: antes de
# publicarse se seudonimizan (HMAC -> p-xxxx), igual que el resto del bus.
# lobby/vault son las zonas de los perfiles laptop/replay; el resto, las de la maqueta.
[permissions]
person-sim-01 = ["entrada-acceso", "entrada-control", "bodega-pasillo", "bodega-almacen", "lobby", "vault"]
person-sim-02 = ["entrada-acceso", "bodega-pasillo", "estac-vehiculos", "estac-acceso", "lobby"]
person-sim-03 = ["entrada-acceso", "perimetro-camino", "estac-vehiculos", "estac-acceso"]
person-sim-04 = ["entrada-acceso", "bodega-pasillo", "perimetro-camino", "estac-vehiculos"]

# --- Maqueta multicámara (solo la usa camera.kind = "fake", perfil sim) ---------
# Cada cámara tiene nombre visible, escena, resolución y zonas (franjas horizontales).
# Los zone_id son únicos entre cámaras.
[[cameras]]
camera_id = "cam-01"
name = "Entrada"
scene = "Acceso principal y control"
fps = 10.0
width = 1920
height = 1080
[[cameras.zones]]
zone_id = "entrada-acceso"
restricted = false
x_min = 0.0
x_max = 0.5
[[cameras.zones]]
zone_id = "entrada-control"
restricted = true
x_min = 0.5
x_max = 1.0

[[cameras]]
camera_id = "cam-02"
name = "Bodega"
scene = "Pasillo y almacén"
fps = 10.0
width = 1920
height = 1080
[[cameras.zones]]
zone_id = "bodega-pasillo"
restricted = false
x_min = 0.0
x_max = 0.45
[[cameras.zones]]
zone_id = "bodega-almacen"
restricted = true
x_min = 0.45
x_max = 1.0

[[cameras]]
camera_id = "cam-03"
name = "Perímetro"
scene = "Cerca norte y camino de ronda"
fps = 10.0
width = 1920
height = 1080
[[cameras.zones]]
zone_id = "perimetro-cerca"
restricted = true
x_min = 0.0
x_max = 0.3
[[cameras.zones]]
zone_id = "perimetro-camino"
restricted = false
x_min = 0.3
x_max = 1.0

[[cameras]]
camera_id = "cam-04"
name = "Estacionamiento"
scene = "Plazas y acceso vehicular"
fps = 10.0
width = 1920
height = 1080
[[cameras.zones]]
zone_id = "estac-vehiculos"
restricted = false
x_min = 0.0
x_max = 0.7
[[cameras.zones]]
zone_id = "estac-acceso"
restricted = false
x_min = 0.7
x_max = 1.0

# --- sim: sin hardware. Cámara falsa, tag, identidad y actuador simulados. ---
[profiles.sim.camera]
kind = "fake"                   # con [[cameras]] definidas: una cámara sintética por entrada
stream_id = "cam-01"            # solo se usa si no hay [[cameras]]
fps = 10.0

[profiles.sim.detector]
kind = "scenes"                 # personas, vehículos y movimiento por cámara; "moving" = 2 personas

# Escenas aleatorias (semilla: --seed; sin ella se elige una y se imprime al arrancar).
[profiles.sim.scenes]
spawn_rate_per_s = 0.35         # altas por segundo y cámara
max_actors = 4                  # simultáneos por cámara
vehicle_ratio = 0.25
motion_ratio = 0.1              # movimiento sin clase
stranger_ratio = 0.2            # persona sin tag ni rostro conocido (intrusión)
no_tag_ratio = 0.15             # persona conocida sin tag
dropouts = true                 # caídas y recuperaciones de cámara
dropout_interval_s = 30.0       # media entre caídas
dropout_duration_s = 6.0

[profiles.sim.tag]
kind = "sim"
interval_s = 1.0

[profiles.sim.identity]
kind = "sim"
interval_s = 2.0

[profiles.sim.actuator]
kind = "sim"
interval_s = 1.0

# --- laptop: webcam + YOLOv8n + tag XIAO C6 (tagbridge) + actuador simulado. ---
# Sin webcam, sin pesos o sin C6 el sistema sigue y lo muestra como "degraded".
[profiles.laptop.camera]
kind = "webcam"
stream_id = "cam-01"
device_index = 0
fps = 15.0

[profiles.laptop.detector]
kind = "yolov8n"
# Pesos (nunca se versionan). Prioridad: variable CONDOR_WEIGHTS > esta clave.
weights = "weights/yolov8n.pt"
config_path = "configs/surveillance.toml"

[profiles.laptop.tag]
kind = "c6"

[profiles.laptop.identity]
kind = "none"

[profiles.laptop.actuator]
kind = "sim"
interval_s = 1.0

# --- replay: video grabado + JSONL de estimaciones de tag. ---
[profiles.replay.camera]
kind = "file"
stream_id = "replay-01"
path = "data/replay/clip.mp4"
fps = 15.0

[profiles.replay.detector]
kind = "yolov8n"
# Pesos (nunca se versionan). Prioridad: variable CONDOR_WEIGHTS > esta clave.
weights = "weights/yolov8n.pt"
config_path = "configs/surveillance.toml"

[profiles.replay.tag]
kind = "replay"
path = "data/replay/tags.jsonl"
interval_s = 0.5

[profiles.replay.identity]
kind = "none"

[profiles.replay.actuator]
kind = "none"
