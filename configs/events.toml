# Zonas y umbrales del detector de eventos (issue #12).
# Coordenadas: punto de apoyo normalizado [0, 1] (x a la derecha, y hacia abajo).
# `cam-sim` es la cámara de los escenarios sintéticos del benchmark; para una
# cámara real se dibujan sus polígonos sobre un frame y se añade otra [[zones]].

[policy]
max_gap_s = 2.0        # hueco mayor (oclusión, track perdido) reinicia el track
exit_grace_s = 1.0     # histéresis de salida de zona
authorized = "downgrade"  # "downgrade" -> severidad review; "suppress" -> suppressed

[[zones]]
name = "acceso_restringido"
stream_id = "cam-sim"
polygon = [[0.68, 0.50], [0.95, 0.50], [0.95, 0.92], [0.68, 0.92]]
restricted = true
intrusion_min_s = 0.6

[[zones]]
name = "plaza"
stream_id = "cam-sim"
polygon = [[0.08, 0.35], [0.55, 0.35], [0.55, 0.90], [0.08, 0.90]]
loiter_dwell_s = 30.0
loiter_max_disp = 0.12
crowd_threshold = 5
crowd_dwell_s = 5.0
