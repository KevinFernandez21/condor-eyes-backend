[project]
name = "condor-eye"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.9",
    "bleak>=3.0.2",
    "onnx>=1.23.1",
    "onnxruntime>=1.30.0",
    "onnxslim>=0.1.97",
    "openvino>=2026.4.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.123",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

# Laptop x86_64 (RTX serie 50, Blackwell): torch con CUDA 13.0 desde el índice de PyTorch.
# En aarch64 (Jetson, a futuro) se usará el wheel de JetPack; este índice no aplica allí.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" }]
torchvision = [{ index = "pytorch-cu130", marker = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
